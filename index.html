  log(c,'Homeowner','Leak reported ('+r.location+', '+r.recurrence+')');log(c,'System','Diagnosis visit booked — '+fmtD(r.day)+', '+r.win);
  S.cases[id]=c;save();D.r={_new:true};go('#/h/done/'+id)},
 second:function(id){var c=S.cases[id];c.second={status:'Requested',expert:PEOPLE.second,requestedAt:now(),visitAt:nextDays(1)[0]};log(c,'Homeowner','Free second opinion requested');save();toast('Second opinion booked with '+PEOPLE.second);render()},
 pickPlan:function(id,pl){D.plan=D.plan||{};D.plan[id]=pl;render()},
 accept:function(id){var c=S.cases[id];var pl=(D.plan&&D.plan[id])||'Essential';c.quote={plan:pl,price:PLAN[pl].rate*c.audit.area,acceptedAt:now()};c.area=c.audit.area;
  var p=matchPartner(c);log(c,'Homeowner','DryProof '+pl+' accepted');
  if(p){c.partnerId=p.id;c.stages[0].status='Open';log(c,'System','Matched to '+p.name+' ('+p.tier+')');toast('Accepted. Your partner is '+p.name+'.')}else{c.reassignPending=true;toast('Accepted. Asian Paints will confirm your partner within 24 hours.')}
  save();render()},
 reassign:function(id){modal('<h2>Request a different partner</h2><label class="f" for="rr">Reason</label><select class="in" id="rr"><option>Dates do not suit me</option><option>I had a bad experience before</option><option>I prefer a partner closer to me</option><option>Other</option></select><div class="row" style="margin-top:14px"><button class="btn c" onclick="A.doReassign(\''+id+'\')">Request</button><button class="btn o" onclick="A.close()">Cancel</button></div>')},
 doReassign:function(id){var c=S.cases[id];var reason=document.getElementById('rr').value;c.excluded.push(c.partnerId);var old=partner(c.partnerId);var p=matchPartner(c);
  if(p){c.partnerId=p.id;log(c,'Homeowner','Partner change requested ('+reason+') — '+old.name+' → '+p.name);toast('New partner: '+p.name)}else{c.partnerId=null;c.reassignPending=true;c.stages[0].status='Locked';log(c,'Homeowner','Partner change requested ('+reason+')');toast('Request sent. Asian Paints will confirm a new partner within 24 hours.')}
  closeModal();save();render()},
 raise:function(id){var f=D.cf;var el=document.getElementById('cd');if(el)f.desc=el.value;if(!f.severity){f.err='Choose how bad it is.';return render()}if(f.desc.trim().length<5){f.err='Describe the problem.';return render()}
  var kid='CL-'+(S.claimSeq++);S.claims[kid]={id:kid,caseId:id,raisedAt:now(),where:f.where,noticed:f.noticed,severity:f.severity,desc:f.desc,photo:f.photo,status:'Linked',visitAt:null,cause:null,reason:''};
  log(S.cases[id],'Homeowner','Complaint '+kid+' raised');save();D.cf=null;go('#/h/case/'+id);setTimeout(function(){var e=document.getElementById(kid);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},60);toast('Complaint '+kid+' raised. Visit before '+fmt(now()+48*HR)+'.')},
 cfPhoto:function(inp){var f=inp.files&&inp.files[0];if(!f)return;resizeFile(f,function(d){D.cf.photo=d;render()})},
 confirmFix:function(kid){var k=S.claims[kid];k.status='Closed';k.closedAt=now();var c=S.cases[k.caseId];if(c)log(c,'Homeowner','Complaint '+kid+' closed');save();toast('Thanks — complaint closed.');render()},
 ask:function(q){q=(q||'').trim();if(!q)return;var cs=myCases();var cid=(D.askCase&&S.cases[D.askCase])?D.askCase:(cs[0]&&cs[0].id);if(!cid)return;S.chat.push({f:'u',t:q});S.chat.push({f:'b',t:answer(q,S.cases[cid])});save();render();var ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight},
 join:function(){S.circle.joined=true;save();toast('Welcome to DryProof Circle');render()},
 remind:function(){S.circle.reminder=document.getElementById('rm').value;save();toast('We will remind you in '+S.circle.reminder);render()},
 askCircle:function(q){q=(q||'').trim();if(q.length<5){toast('Type your question');return}S.circle.questions.unshift({q:q,by:'You',a:null});S.circle.joined=true;save();toast('Posted. An expert usually answers within a day.');render()},
 // partner
 stagePhoto:function(cid,i,inp){var f=inp.files&&inp.files[0];if(!f)return;resizeFile(f,function(d){D.sp=D.sp||{};D.sp[cid+'-'+i]=d;render()})},
 stageSample:function(cid,i){D.sp=D.sp||{};D.sp[cid+'-'+i]=STAGE_ILL[i];render()},
 signStage:function(cid,i){var c=S.cases[cid],ph=D.sp&&D.sp[cid+'-'+i];if(!ph){toast('Take a photo first');return}
  var prev=null;for(var j=i-1;j>=0;j--){if(c.stages[j].status==='Done'){prev=c.stages[j];break}}
  var t=now();
  if(prev&&t-prev.at<30*MIN){c.flags=c.flags||[];c.flags.push({stage:i+1,at:t,text:STAGES[i]+' signed '+dur(t-prev.at)+' after '+STAGES[i-1]+' (expected several hours).'})}
  var p=partner(c.partnerId);var redo=c.stages[i].status==='Redo';doStage(c,i,t,p.name,ph);delete D.sp[cid+'-'+i];
  log(c,p.name,(redo?'Redo signed: ':'Stage signed: ')+STAGES[i]);
  if(i<4){var nx=c.stages[i+1];if(nx.status!=='Redo')nx.status='Open'}
  if(i===4){c.cureUntil=t+72*HR;if(c.warranty&&c.warranty.status==='On hold')c.warranty=null;c.flood=null}
  else if(c.stages[i+1].status==='Redo'){}
  save();toast(STAGES[i]+' signed off. The homeowner can see it now.');render()},
 fixPhoto:function(kid,inp){var f=inp.files&&inp.files[0];if(!f)return;resizeFile(f,function(d){D.fix=D.fix||{};D.fix[kid]=d;render()})},
 fixSample:function(kid){D.fix=D.fix||{};D.fix[kid]=ILL.coat2;render()},
 fixDone:function(kid){var k=S.claims[kid];k.fixedAt=now();k.fixPhoto=D.fix[kid];var c=S.cases[k.caseId];if(c)log(c,partner(c.partnerId).name,'Complaint fix done for '+kid);save();toast('Fix submitted. The homeowner will confirm.');render()},
 // AP
 diagSign:function(id){var c=S.cases[id];var mo=parseInt(document.getElementById('mo').value)||SYS[c.location].moist;var ar=parseInt(document.getElementById('ar').value)||400;var rc=document.getElementById('rc').value.trim()||SYS[c.location].cause;
  c.audit={by:PEOPLE.diag,at:now(),moist:mo,cause:rc,system:SYS[c.location].name,area:ar,photo:ILL.thermal};c.area=ar;log(c,PEOPLE.diag,'Diagnosis report signed');save();toast('Report sent to the homeowner');go('#/ap/diag')},
 secondDecide:function(id,ok){var c=S.cases[id];var rv=document.getElementById('rv').value.trim();if(!ok&&rv.length<5){toast('Write the corrected root cause');return}
  c.second.status=ok?'Confirmed':'Revised';c.second.note=rv;if(!ok)c.audit.cause=rv;c.second.at=now();log(c,PEOPLE.second,ok?'Second opinion: diagnosis confirmed':'Second opinion: diagnosis revised');save();toast('Second opinion saved');go('#/ap/diag')},
 floodStart:function(id){var c=S.cases[id];c.flood={start:now(),result:null};log(c,PEOPLE.qc,'Flood test started');save();toast('Flood test started — result after 48 hours');render()},
 floodDecline:function(id){if(!confirm('Record that the customer declined the flood test? The warranty will be 5 years.'))return;var c=S.cases[id];c.flood={start:now(),result:'Declined'};D.qc=D.qc||{};A._qcPass(id,'Customer declined the 48-hour flood test, so the warranty is 5 years instead of 10.');},
 qcPhoto:function(id,inp){var f=inp.files&&inp.files[0];if(!f)return;resizeFile(f,function(d){D.qc=D.qc||{};D.qc[id]=d;render()})},
 qcSample:function(id){D.qc=D.qc||{};D.qc[id]=ILL.flood;render()},
 qcResult:function(id,pass){var c=S.cases[id];
  if(pass){if(c.flood&&!c.flood.result)c.flood.result='Pass';A._qcPass(id,c.flood?'All 6 stages verified and 48-hour flood test passed.':'All stages verified and final QC passed.')}
  else{c.qc={pass:false,by:PEOPLE.qc,at:now()};c.firstTimeRight=false;c.stages[3].status='Redo';c.stages[4].status='Redo';c.flood=null;c.cureUntil=null;
   c.warranty={status:'On hold',reason:'Final check failed: the membrane coats (Coat 1 and Coat 2) must be redone before your warranty is issued.'};
   var p=partner(c.partnerId);p.ftr=Math.max(80,p.ftr-1.2);log(c,PEOPLE.qc,'Final QC failed — Coat 1 and Coat 2 sent back for redo');save();toast('Sent back to the partner for redo');go('#/ap/qc')}},
 _qcPass:function(id,reason){var c=S.cases[id];var first=!c.qc;var t=now();
  c.stages[5].status='Done';c.stages[5].at=t;c.stages[5].by=PEOPLE.qc;c.stages[5].photo=(D.qc&&D.qc[id])||ILL.flood;c.stages[5].gps=gpsLabel(c);c.stages[5].hash=hashStr(c.stages[5].photo);
  var years=PLAN[c.quote.plan].years;if(c.flood&&c.flood.result==='Declined')years=5;
  c.qc={pass:true,by:PEOPLE.qc,at:t,firstTime:first};c.firstTimeRight=first;
  c.plaque=c.plaque||('AP-DP-'+cityCode(c.city)+'-'+c.id.replace('CASE-',''));
  c.warranty={status:'Active',years:years,issuedAt:t,reason:reason};
  var p=partner(c.partnerId);p.jobs++;
  log(c,PEOPLE.qc,'Final QC passed — '+years+'-year warranty issued automatically');
  if(D.qc)delete D.qc[id];save();toast('Signed. '+years+'-year warranty issued and partner payout released.');go('#/ap/tower')},
 quickDiag:function(id){var c=S.cases[id];c.audit={by:PEOPLE.diag,at:now(),moist:SYS[c.location].moist,cause:SYS[c.location].cause,system:SYS[c.location].name,area:c.area,photo:ILL.thermal};log(c,PEOPLE.diag,'Diagnosis report signed');save();toast('Diagnosis report signed by '+PEOPLE.diag);render()},
 quickSign:function(cid,i){D.sp=D.sp||{};if(!D.sp[cid+'-'+i])D.sp[cid+'-'+i]=STAGE_ILL[i];A.signStage(cid,i)},
 runChecks:function(id){var c=S.cases[id];var t=now();if(t<c.cureUntil){S.clockMin+=Math.ceil((c.cureUntil-t)/MIN)+1}if(PLAN[c.quote.plan].flood){if(!c.flood){c.flood={start:now(),result:null};log(c,PEOPLE.qc,'Flood test started')}var end=c.flood.start+48*HR;if(now()<end)S.clockMin+=Math.ceil((end-now())/MIN)+1}D.qc=D.qc||{};if(!D.qc[id])D.qc[id]=ILL.flood;save();toast('Clock moved ahead — cure'+(PLAN[c.quote.plan].flood?' and 48 h flood test':'')+' complete');render()},
 visit:function(id){var k=S.claims[id];k.visitAt=now();save();toast('Visit recorded');render()},
 decide:function(id){var k=S.claims[id];var rs=document.getElementById('rs').value.trim();if(!D.cause){toast('Choose the cause');return}if(rs.length<5){toast('Write the reason for the customer');return}
  k.cause=D.cause;k.reason=rs;k.decidedAt=now();D.cause=null;
  var c=S.cases[k.caseId];var pid=c?c.partnerId:(S.projects[k.projectId]&&S.projects[k.projectId].partnerId);
  if(k.cause==='Workmanship'&&pid){var p=partner(pid);p.complaints++;p.ftr=Math.max(80,p.ftr-1.5)}
  if(c)log(c,PEOPLE.claims,'Complaint '+id+' decided: '+k.cause);
  if(k.projectId&&k.cause!=='Material'){k.fixedAt=k.cause==='Workmanship'?null:k.fixedAt}
  save();toast('Decision saved and shared with the customer');render()},
 apFix:function(id){var k=S.claims[id];k.fixedAt=now();save();toast('Marked fixed. Waiting for customer confirmation.');render()},
 // builder
 audit:function(){D.auditDone='SA-'+(S.leadSeq++);S.leads.push({id:D.auditDone,project:document.getElementById('ap').value,at:now()});save();render()},
 bRaise:function(){var b=D.bc;var el=document.getElementById('bd');if(el)b.desc=el.value;if(b.desc.trim().length<5){b.err='Describe the problem.';return render()}
  var kid='CL-'+(S.claimSeq++);var pr=S.projects['PRJ-201'];S.claims[kid]={id:kid,caseId:null,projectId:pr.id,projectName:pr.name,flat:b.flat,raisedAt:now(),where:'Flat '+b.flat,severity:'Builder complaint',desc:b.desc,photo:null,status:'Linked',visitAt:null,cause:null,reason:''};
  save();D.bc=null;toast('Complaint '+kid+' raised. Visit within 48 hrs.');render()}
};
// builder complaint: workmanship fix by partner — allow AP to mark done for project claims
var _origClaim=vClaim;
vClaim=function(id){var k=S.claims[id];var h=_origClaim(id);if(k&&k.projectId&&k.cause==='Workmanship'&&!k.fixedAt&&k.status!=='Closed'){h=h.replace('Waiting for the partner to upload the fix.</p>','Partner crew assigned to fix it at their cost.</p><button class="btn g" onclick="A.apFix(\''+id+'\')">Mark fix verified</button>')}
 if(k&&k.projectId&&(k.fixedAt||k.cause==='Outside job scope')&&k.status!=='Closed'){h+='<div class="card"><button class="btn o" onclick="A.confirmFix(\''+id+'\')">Builder confirmed — close complaint</button></div>'}
 return h};

/* expose state for inline handlers */
Object.defineProperty(window,'S',{get:function(){return S},configurable:true});
Object.defineProperty(window,'D',{get:function(){return D},configurable:true});
window.save=save;window.render=render;

/* ================= BOOT ================= */
load();
if(/[?&]demo=1/.test(location.search)){S.demo=true;save()}
if(!location.hash)location.replace('#/');
render();
})();
</script>
