<style>
:root{--p:#4B2A7B;--p2:#5E3A96;--pd:#2A1747;--pl:#F2EEF9;--pl2:#E6DEF3;--c:#E8483F;--c2:#D33A31;--cl:#FDEDEC;--t:#1E1B26;--m:#6B6678;--b:#E9E5F0;--g:#1F9D5C;--gl:#E6F6EE;--a:#A86B00;--al:#FFF5E1;--bg:#F7F5FB;--w:#fff;
--sh1:0 1px 2px rgba(42,23,71,.05),0 6px 20px rgba(42,23,71,.06);--sh2:0 2px 4px rgba(42,23,71,.06),0 14px 34px rgba(42,23,71,.12);--r:18px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15.5px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--p);text-underline-offset:3px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.22;margin:0 0 .45em;letter-spacing:-.2px}
h1{font-size:1.6rem;font-weight:800}h2{font-size:1.18rem;font-weight:750}h3{font-size:1.02rem;font-weight:700}
p{margin:.3em 0 .75em}
/* Header */
.top{background:linear-gradient(100deg,var(--pd),var(--p) 55%,#6A3FA0);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(42,23,71,.25)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;white-space:nowrap}
.brand b{font-size:1.2rem;letter-spacing:.1px;font-weight:800}
.brand small{opacity:.8;font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.28)}.logo img{width:100%;height:100%;object-fit:contain}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
.hero-logo{flex:none;width:132px;height:132px;border-radius:50%;background:#fff;display:grid;place-items:center;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.32)}.hero-logo img{width:100%;height:100%;object-fit:contain}
@media(max-width:620px){.hero-logo{width:78px;height:78px}.hero-row{gap:14px}}
.plogo{width:54px;height:54px;object-fit:contain;flex:none}
.foot{max-width:1200px;margin:-70px auto 0;padding:0 18px 36px;display:flex;align-items:center;gap:10px;color:var(--m);font-size:.8rem}.foot img{width:30px;height:30px;object-fit:contain}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.nav a{color:#fff;text-decoration:none;padding:7px 13px;border-radius:9px;font-size:.9rem;white-space:nowrap;font-weight:600;opacity:.88}
.nav a:hover{background:rgba(255,255,255,.12);opacity:1}
.nav a.on{background:#fff;color:var(--p);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.who{font-size:.8rem;opacity:.85;white-space:nowrap;background:rgba(255,255,255,.1);padding:5px 11px;border-radius:999px}
.switch{background:rgba(20,10,38,.35);border-top:1px solid rgba(255,255,255,.1)}
.switch-in{max-width:1200px;margin:0 auto;padding:7px 18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;transition:background .15s}
.sw:hover{background:rgba(255,255,255,.18)}.sw.on{background:#fff;color:var(--p);border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.sw.rs{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.35)}
.sw.tip{background:transparent;border:1px dashed rgba(255,255,255,.4)}
.vlabel{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;opacity:.7;font-weight:700;margin-right:4px}
/* Demo guide */
.guide{background:#FFF9EC;border-bottom:1px solid #F3E2B8;color:#4a3500}
.guide-in{max-width:1200px;margin:0 auto;padding:8px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.guide .gstep{background:var(--c);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.guide .gtxt{flex:1;min-width:200px;font-weight:600}
.guide .gtxt b{color:var(--p)}
.guide button{background:transparent;border:0;color:#8a6d2a;font-size:.8rem;text-decoration:underline}
/* Layout */
main{max-width:1200px;margin:0 auto;padding:26px 18px 100px}
.card{background:var(--w);border:1px solid var(--b);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh1)}
.card.soft{background:linear-gradient(180deg,#F6F2FC,#F1ECF9);border-color:#E2D8F1;box-shadow:none}
.card.warn{background:var(--al);border-color:#F1DEAE;box-shadow:none}
.card.ok{background:var(--gl);border-color:#BFE6CF;box-shadow:none}
.card.bad{background:var(--cl);border-color:#F5C7C3;box-shadow:none}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.nav{margin-left:0;width:100%}.top-in{gap:8px}.ph{min-width:62px;font-size:.72rem}.card{padding:16px}h1{font-size:1.35rem}}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:11px 18px;background:var(--p);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 14px rgba(75,42,123,.22);transition:transform .12s,box-shadow .12s,background .12s;line-height:1.2}
.btn:hover{background:var(--p2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(75,42,123,.28)}
.btn:active{transform:none}
.btn.c{background:var(--c);box-shadow:0 6px 14px rgba(232,72,63,.28)}.btn.c:hover{background:var(--c2)}
.btn.g{background:var(--g);box-shadow:0 6px 14px rgba(31,157,92,.25)}
.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--pl2);box-shadow:none}
.btn.o:hover{background:var(--pl);border-color:var(--p)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.dm,.btn.o.dm{background:var(--al);color:#7a4f00;border:1.5px dashed #E0B04C;box-shadow:none}
.btn.dm:hover{background:#FFEDC2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--m)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--pl);color:var(--p);white-space:nowrap}
.chip.g{background:var(--gl);color:#157a46}
.chip.c{background:var(--cl);color:#B4302A}
.chip.a{background:var(--al);color:var(--a)}
.chip.k{background:#F0EEF3;color:#5d5a66}
/* Forms */
label.f{display:block;font-weight:700;font-size:.86rem;margin:14px 0 6px}
.in{width:100%;padding:11px 13px;border:1.5px solid var(--b);border-radius:12px;background:#fff;transition:border-color .15s}
.in:focus{border-color:var(--p)}
.in:focus,.opt:focus,.btn:focus-visible{outline:3px solid #D5C6EE;outline-offset:1px}
textarea.in{min-height:88px;resize:vertical}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--b);background:#fff;border-radius:12px;padding:10px 14px;text-align:left;transition:border-color .12s,background .12s}
.opt:hover{border-color:#CDBFE6}
.opt.on{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:700;box-shadow:0 0 0 3px rgba(75,42,123,.08)}
.err{color:#B4302A;font-size:.85rem;margin-top:6px}
/* Phase tracker */
.phases{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto;padding-bottom:2px}
.ph{flex:1;min-width:92px;text-align:center;position:relative;padding-top:38px;font-size:.82rem;color:var(--m);font-weight:600}
.ph:before{content:"";position:absolute;top:15px;left:0;right:0;height:4px;background:var(--b);border-radius:4px}
.ph:first-child:before{left:50%}.ph:last-child:before{right:50%}
.ph i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--b);font-style:normal;font-size:.8rem;display:grid;place-items:center;font-weight:800;z-index:1}
.ph.done{color:var(--g)}.ph.done:before{background:var(--g)}.ph.done i{background:var(--g);border-color:var(--g);color:#fff}
.ph.cur{color:var(--c);font-weight:800}.ph.cur i{border-color:var(--c);color:var(--c);box-shadow:0 0 0 5px rgba(232,72,63,.14)}
/* Stage list */
.stages{list-style:none;margin:0;padding:0}
.stg{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--b);align-items:flex-start}
.stg:first-child{border-top:0}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:#F0EEF3;color:#7a7585}
.dot.done{background:var(--g);color:#fff}.dot.open{background:var(--c);color:#fff;box-shadow:0 0 0 4px rgba(232,72,63,.15)}.dot.redo{background:var(--a);color:#fff}
.thumb{width:78px;height:58px;border-radius:10px;object-fit:cover;border:1px solid var(--b);background:#f0eef4;cursor:zoom-in;transition:transform .12s}
.thumb:hover{transform:scale(1.04)}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--b);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--m);font-weight:800}
tbody tr:hover td{background:#FBFAFD}
.tw{overflow-x:auto}
/* KPI + dashboard */
.kpi{background:#fff;border:1px solid var(--b);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.kpi b{display:block;font-size:1.75rem;color:var(--pd);line-height:1.1;font-weight:800;letter-spacing:-.5px}
.kpi span{font-size:.8rem;color:var(--m);font-weight:600}
.kpi em{font-style:normal;font-size:.74rem;display:block;margin-top:6px;font-weight:700}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--pl2)}
.kpi.good:before{background:var(--g)}.kpi.amber:before{background:#E7A600}.kpi.bad:before{background:var(--c)}.kpi.info:before{background:var(--p)}
.bar{height:10px;border-radius:10px;background:#EEEAF4;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:10px}
.bar.c>div{background:linear-gradient(90deg,#FF7A6E,var(--c))}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;margin-bottom:10px;border:1px solid}
.alert .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:1.05rem}
.alert.crit{background:#FFF4F3;border-color:#F7CFCB}.alert.crit .ico{background:var(--c);color:#fff}
.alert.warn{background:#FFF9EA;border-color:#F2DFAE}.alert.warn .ico{background:#E7A600;color:#fff}
.alert.info{background:var(--pl);border-color:#DCD0F0}.alert.info .ico{background:var(--p);color:#fff}
.sev{font-size:.68rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.spot{border:0;border-radius:20px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--c),var(--p)) border-box;border:2px solid transparent;padding:20px;margin-bottom:18px;box-shadow:var(--sh2);min-width:0;overflow:hidden}
/* Home */
.role{display:block;text-align:left;background:#fff;border:1px solid var(--b);border-radius:20px;padding:22px;width:100%;box-shadow:var(--sh1);transition:transform .15s,box-shadow .15s,border-color .15s}
.role:hover{border-color:#CDBFE6;box-shadow:var(--sh2);transform:translateY(-3px)}
.role .ic{width:50px;height:50px;border-radius:14px;background:var(--pl);display:grid;place-items:center;margin-bottom:14px}
.role .go{display:inline-block;margin-top:12px;font-weight:800;color:var(--c);font-size:.88rem}
.hero{position:relative;overflow:hidden;padding:30px 30px!important;background:radial-gradient(circle at 88% 12%,rgba(232,72,63,.55),transparent 34%),radial-gradient(circle at 70% 120%,rgba(140,100,220,.45),transparent 40%),linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-radius:26px;padding:38px 34px;margin-bottom:26px;box-shadow:var(--sh2)}
.hero h1{font-size:1.9rem;line-height:1.1;max-width:640px;letter-spacing:-.8px}
.hero .lead{opacity:.92;max-width:600px;font-size:1.05rem}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.6px;margin-bottom:14px}
.hero .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hero .btn.o:hover{background:rgba(255,255,255,.12)}
.hsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:26px}
.hsteps div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px}
.hsteps b{display:block;font-size:.95rem}
.hsteps span{font-size:.78rem;opacity:.85}
.hsteps i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--p);font-size:.72rem;font-weight:800;margin-bottom:6px}
@media(max-width:900px){.hsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:1.8rem}.hero{padding:28px 22px}}
.sec{font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--m);font-weight:800;margin:6px 0 12px}
.list-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 16px;border:1px solid var(--b);border-radius:16px;background:#fff;margin-bottom:10px;flex-wrap:wrap;box-shadow:var(--sh1)}
.cert{border-radius:20px;padding:22px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--g),var(--p)) border-box;border:2px solid transparent;position:relative;box-shadow:var(--sh2)}
.cert .seal{position:absolute;right:18px;top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pd);color:#fff;padding:12px 20px;border-radius:999px;z-index:90;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,35,.55);display:grid;place-items:center;z-index:80;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.chat{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow:auto;padding:6px;background:#FBFAFD;border-radius:14px;border:1px solid var(--b)}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:5px}
.msg.b{align-self:flex-start;background:#fff;border:1px solid var(--b);border-bottom-left-radius:5px}
.demo-btn{position:fixed;right:16px;bottom:16px;z-index:70;background:var(--pd);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.demo{position:fixed;right:16px;bottom:66px;z-index:71;background:#1d1726;color:#fff;border-radius:16px;padding:14px;width:300px;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:.86rem}
.demo h4{margin:8px 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;opacity:.7}
.demo button,.demo select{background:#342b42;color:#fff;border:0;border-radius:8px;padding:6px 9px;margin:0 4px 5px 0;font-size:.82rem}
.demo button:hover{background:#4a3d5e}
.qr{width:124px;height:124px;background:#fff;padding:7px;border-radius:12px;border:1px solid var(--b);box-shadow:var(--sh1)}
.illus{width:100%;border-radius:14px;border:1px solid var(--b);display:block}
details{border:1px solid var(--b);border-radius:14px;padding:11px 15px;background:#fff;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
.flag{border-left:4px solid var(--c);background:#fff;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.flag.r{border-left-color:var(--a)}
hr{border:0;border-top:1px solid var(--b);margin:16px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{.top,.demo-btn,.demo,.noprint,.guide{display:none!important}body{background:#fff}main{padding:0}.card{border:0;padding:0;box-shadow:none}}
</style>

function matchPartner(c){

 var cand=Object.values(S.partners).filter(function(p){return p.skills.indexOf(c.location)>=0&&TIER[p.tier].rank>=need&&c.excluded.indexOf(p.id)<0});
 var local=cand.filter(function(p){return p.city===c.city});if(local.length)cand=local;
 cand.sort(function(x,y){

function allFlags(){
 var out=[];var cases=Object.values(S.cases);var t=now();
 var hashes={};
 cases.forEach(function(c){c.stages.forEach(function(s){if(s.status==='Done'&&s.hash&&s.photo&&s.photo.indexOf('data:image/svg')!==0){(hashes[s.hash]=hashes[s.hash]||[]).push(c.id+' · '+STAGES[s.n-1])}})});
 cases.forEach(function(c){var fl=c.flags||[];if(fl.length)out.push({kind:'rush',sev:'r',title:'Stages done too fast: '+c.id,body:fl.length===1?fl[0].text:fl.length+' stages were signed within minutes of each other (each normally takes several hours). Latest: '+fl[fl.length-1].text,caseId:c.id,action:'Site check before final QC'})});
 Object.keys(hashes).forEach(function(h){if(hashes[h].length>1)out.push({kind:'photo',sev:'r',title:'Same photo used twice',body:hashes[h].join(' and '),caseId:hashes[h][0].split(' · ')[0],action:'Site check'})});
 Object.values(S.partners).forEach(function(p){if(p.ftr<95)out.push({kind:'ftr',sev:'r',title:'Partner quality slipping: '+p.name,body:'First-time-right '+p.ftr.toFixed(1)+'% (below 95%). '+p.complaints+' complaints this year.',partnerId:p.id,action:'Check their next jobs first'})});
 var byCS={};Object.values(S.claims).forEach(function(k){var c=S.cases[k.caseId];if(!c)return;var key=c.city+'|'+c.location;byCS[key]=(byCS[key]||0)+1});
 Object.keys(byCS).forEach(function(k){if(byCS[k]>=2){var p=k.split('|');out.push({kind:'sys',sev:'r',title:p[1]+' jobs: '+byCS[k]+' complaints in '+p[0],body:'More complaints than other cities for the same system this quarter.',action:'Technical review'})}});
 Object.keys(S.network).forEach(function(city){var cap=S.network[city]*4,b=S.aprilBookings[city];if(b>cap)out.push({kind:'cap',sev:'r',title:'April bookings above crew capacity: '+city,body:b+' bookings vs '+cap+' jobs of crew capacity ('+S.network[city]+' crews × 4).',action:'Certify more crews'})});
 Object.values(S.claims).forEach(function(k){if(k.status!=='Closed'&&!k.visitAt&&t-k.raisedAt>40*HR)out.push({kind:'sla',sev:'',title:'Complaint '+k.id+' near 48 hrs without a visit',body:'Raised '+dur(t-k.raisedAt)+' ago. Simple rule, not AI.',claimId:k.id,action:'Escalate'})});
 return out;
}

function specCalc(sp){

  if(sp.exposure==='Coastal'&&(el==='Terrace'))layers.push('Chloride-resistant UV top coat');

}
